<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workshop GP · Thông báo tăng Power</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dce8f8;color:#16355c;font-family:'Segoe UI',sans-serif}.layout{display:flex;align-items:center;justify-content:center;gap:48px;min-height:100vh;padding:32px}.screen{width:390px;aspect-ratio:450/964;container-type:inline-size;position:relative;flex-shrink:0;overflow:hidden;border-radius:22px;box-shadow:0 18px 60px #16355c30;background:#dcebff}.game{width:100%;display:block}.toast{position:absolute;top:calc(22.93% + 12px);left:50%;transform:translateX(-50%);width:calc(100% - 64px);max-width:310px;min-height:62px;border:1.5px solid #79a4ed;border-radius:15px;background:#102b4ff5;box-shadow:inset 0 1px #ffffff30,0 3px 0 #061a39,0 7px 18px #0a244837;display:flex;align-items:center;gap:12px;padding:9px 12px;color:#fff;pointer-events:none;opacity:1}.badge{width:40px;height:40px;flex-shrink:0;border-radius:11px;background:linear-gradient(#4195ff,#2261dc);border:1px solid #94c1ff;box-shadow:inset 0 2px #ffffff25,0 2px #071d4c;display:grid;place-items:center}.badge svg{width:29px;height:29px}.value{flex:1;min-width:0}.value small{display:block;color:#b7cfee;font-size:10px;line-height:13px;font-weight:700;letter-spacing:.8px}.value strong{display:block;font-size:25px;line-height:28px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}.gain{display:flex;gap:4px;align-items:center;font-size:24px;font-weight:800;color:#55eb97;white-space:nowrap;letter-spacing:-.6px;font-variant-numeric:tabular-nums}.gain svg{width:19px;height:24px;flex-shrink:0}.toast.enter{animation:enter .22s ease-out}.toast.leave{opacity:0;transform:translate(-50%,-8px);transition:opacity .18s,transform .18s}@keyframes enter{from{opacity:0;transform:translate(-50%,8px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}aside{max-width:340px}aside small{font-weight:700;letter-spacing:2px;color:#517297}h1{font-size:34px;line-height:1.15;margin:14px 0 20px}p{line-height:1.65;color:#526a8a}.actions{display:flex;gap:10px;flex-wrap:wrap}button{font:700 14px 'Segoe UI',sans-serif;min-height:46px;border:1px solid #a9c1e2;border-radius:11px;padding:10px 16px;background:#fff;color:#16355c;cursor:pointer}button.primary{background:#2267ce;color:#fff;border-color:#1752aa}button:focus-visible{outline:3px solid #d96a00;outline-offset:3px}.note{font-size:12px;margin-top:22px}.readout{min-height:48px;font-size:13px}.compact .value strong{font-size:22px}.compact .gain{font-size:21px}@media(max-width:760px){.layout{padding:0;display:block}.screen{width:min(100vw,390px);margin:auto;border-radius:0;box-shadow:none}aside{padding:24px;margin:auto}h1{font-size:26px}}@media(prefers-reduced-motion:reduce){.toast.enter{animation:none}.toast.leave{transition:opacity .15s;transform:translateX(-50%)}}
.hud-power{position:absolute;left:15.4%;top:18.85%;width:16.5%;height:3.5%;background:#102b4f;color:white;font-size:5.55cqw;font-weight:700;line-height:1.15;display:flex;align-items:center}</style>
<main class="layout">
<section class="screen" id="screen" aria-label="Minh họa thông báo tăng Power trên màn Đua">
<img class="game" src="layout_review_assets/power_race_context.png" alt="Giao diện Đua và nâng cấp hiện tại">
<span class="hud-power" id="hud-power" aria-label="Sức mạnh hiện tại">468,6</span><div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
<div class="badge"><svg viewBox="0 0 32 32" fill="none" stroke="white" stroke-width="2.1" stroke-linecap="round"><circle cx="13" cy="10" r="4"/><path d="M5 25v-4c0-6 16-6 16 0v4M23 6c5 0 5 8 0 8M25 17c3 1 4 3 4 5v3"/></svg></div>
<div class="value"><strong id="total">468,6</strong></div>
<div class="gain"><svg viewBox="0 0 20 26" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 13 7-7 7 7M3 22l7-7 7 7"/></svg><span id="delta">+8,2</span></div>
</div>
</section>
<aside><small>WORKSHOP GP / UI CONCEPT</small><h1>Mạnh hơn.<br>Thấy ngay.</h1><p>Thông báo gọn ngay trong vùng đua. Tổng Power mới nổi bật, mức tăng màu xanh và hai mũi tên hướng lên.</p><div class="actions"><button class="primary" id="replay">Xem hiệu ứng +8,2</button><button id="add">Nâng tiếp +8,2</button></div><p class="readout" id="readout">Bản tĩnh để duyệt. Bấm nút để xem banner tự ẩn.</p><p class="note">Số liệu minh họa · Prototype độc lập<br>Không kết nối hoặc thay đổi dữ liệu game.</p></aside>
</main>
<script>
const toast=document.querySelector('#toast'),total=document.querySelector('#total'),delta=document.querySelector('#delta'),readout=document.querySelector('#readout');
let current=468.6,baseline=460.4,active=false,timer,cleanup;
const fmt=n=>n>=1000?(n/1000).toFixed(2).replace('.',',')+'K':n.toFixed(1).replace('.',',');
function show(reset){clearTimeout(timer);clearTimeout(cleanup);if(reset){current=468.6;baseline=460.4}else{if(!active)baseline=current;current=Math.round((current+8.2)*10)/10}active=true;total.textContent=fmt(current);document.querySelector("#hud-power").textContent=fmt(current);delta.textContent='+'+(current-baseline).toFixed(1).replace('.',',');toast.classList.remove('leave','enter');void toast.offsetWidth;toast.classList.add('enter');readout.textContent='Power mới: '+current.toFixed(1).replace('.',',')+' · Tăng: '+(current-baseline).toFixed(1).replace('.',',');timer=setTimeout(()=>{active=false;toast.classList.add('leave');cleanup=setTimeout(()=>toast.classList.remove('enter'),180)},1820)}
document.querySelector('#replay').onclick=()=>show(true);document.querySelector('#add').onclick=()=>show(false);
new ResizeObserver(()=>toast.classList.toggle('compact',document.querySelector('#screen').clientWidth<350)).observe(document.querySelector('#screen'));
</script>
</html>

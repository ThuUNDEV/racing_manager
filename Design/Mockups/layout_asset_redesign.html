<div id="pitlane-layout" class="viz-dotted-background">
<style>
#pitlane-layout{--pl-bg:#dcebff;--pl-card:#edf4ff;--pl-ink:#16355c;--pl-muted:#526a8a;--pl-line:#acc4e6;--pl-blue:#2462ca;--pl-orange:#d96a00;font:14px/1.45 'Segoe UI',sans-serif;color:var(--pl-ink);padding:16px 0}
#pitlane-layout *{box-sizing:border-box}#pitlane-layout [hidden]{display:none!important}#pitlane-layout .pl-review{max-width:422px;margin:0 auto 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:light-dark(#435571,#c6d4e8)}
#pitlane-layout select{font:inherit;padding:8px;max-width:100%}#pitlane-layout .pl-phone{width:100%;max-width:390px;margin:auto;background:var(--pl-bg);border-radius:24px;overflow:hidden;box-shadow:0 12px 36px #16355c22;border:1px solid var(--pl-line)}
#pitlane-layout .pl-head{display:flex;align-items:center;gap:8px;padding:12px;background:#164985;color:white}#pitlane-layout .pl-avatar{width:36px;height:36px;object-fit:contain}#pitlane-layout .pl-wallet{flex:1;min-width:0}#pitlane-layout .pl-wallet b{display:block;font-size:16px}#pitlane-layout .pl-wallet small{color:#dceaff}#pitlane-layout .pl-gems{display:flex;align-items:center;gap:4px;font-weight:700}#pitlane-layout .pl-gems img{width:28px;height:28px;object-fit:contain}
#pitlane-layout button{font:inherit;cursor:inherit;min-height:44px;border:1px solid var(--pl-line);background:#fff;color:var(--pl-ink);border-radius:10px;padding:8px 12px;font-weight:600}#pitlane-layout button:disabled{background:#d5dfea;color:#60738b}#pitlane-layout button:focus-visible{outline:3px solid #f9a423;outline-offset:2px}#pitlane-layout button.pl-main{background:var(--pl-orange);color:white;border-color:#ac4e00;box-shadow:inset 0 2px #ffffff55,0 3px #a74700}#pitlane-layout button.pl-claim{background:#15803d;color:white;border-color:#116431}#pitlane-layout button.pl-on{background:var(--pl-blue);color:white;border-color:#1d51a7}#pitlane-layout button.pl-flat{background:transparent;border-color:transparent;color:inherit;padding:4px 8px}
#pitlane-layout h2{font-size:21px;margin:0}#pitlane-layout h3{font-size:16px;margin:0}#pitlane-layout p{margin:4px 0}#pitlane-layout small{font-size:12px}#pitlane-layout .pl-muted{color:var(--pl-muted)}#pitlane-layout .pl-strip{padding:8px 14px;background:#cbdffb;display:flex;align-items:center;justify-content:space-between;gap:8px}#pitlane-layout .pl-strip button{min-height:36px;font-size:12px}#pitlane-layout .pl-content{padding:16px;display:grid;gap:12px;min-height:420px;align-content:start}#pitlane-layout .pl-row{display:flex;gap:10px;align-items:center}#pitlane-layout .pl-between{justify-content:space-between}#pitlane-layout .pl-grow{flex:1;min-width:0}#pitlane-layout .pl-card{background:var(--pl-card);border:1px solid var(--pl-line);border-radius:14px;padding:12px;box-shadow:0 3px #adc4e066}#pitlane-layout .pl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#pitlane-layout .pl-inventory{grid-template-columns:repeat(3,minmax(0,1fr))}#pitlane-layout .pl-card img{object-fit:contain}#pitlane-layout .pl-art{width:56px;height:56px;flex-shrink:0}#pitlane-layout .pl-hero{display:block;width:100%;height:164px;object-fit:contain}#pitlane-layout .pl-stage{background:linear-gradient(#eaf3ff,#b4cfee);border-radius:14px;padding:12px;text-align:center}#pitlane-layout .pl-stage img{filter:drop-shadow(0 12px 9px #16355c33)}#pitlane-layout .pl-seg{display:flex;gap:6px}#pitlane-layout .pl-seg button{flex:1;padding:8px 4px}#pitlane-layout .pl-track{width:100%;display:block;border-radius:12px}#pitlane-layout .pl-meter{height:7px;border-radius:5px;background:#c8d8ee;margin-top:7px;overflow:hidden}#pitlane-layout .pl-meter span{display:block;background:#2f6fe0;height:100%}#pitlane-layout .pl-tag{display:inline-block;border-radius:5px;padding:2px 6px;background:#d4e5fc;color:#164985;font-size:12px}#pitlane-layout .pl-inventory button{display:grid;justify-items:center;align-content:start;gap:6px;padding:10px 6px;min-width:0}#pitlane-layout .pl-inventory img{height:52px;width:52px;object-fit:contain}#pitlane-layout .pl-slot{height:52px;display:grid;place-items:center;font-size:28px;color:#7389a5}#pitlane-layout .pl-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px 4px 10px;background:#164985;gap:3px}#pitlane-layout .pl-nav button{border:0;background:transparent;color:#d5e7ff;display:grid;place-items:center;padding:4px 0;font-size:12px;border-radius:10px;gap:2px}#pitlane-layout .pl-nav button[aria-pressed=true]{background:#da700c;color:white}#pitlane-layout .pl-nav img{height:30px;width:30px;object-fit:contain}
#pitlane-layout .pl-sheet{border-top:5px solid #f3982b;background:#f3f7ff;border-radius:18px;padding:16px;display:grid;gap:12px}#pitlane-layout .pl-rule{height:1px;background:var(--pl-line);margin:4px 0}#pitlane-layout .pl-swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}#pitlane-layout .pl-swatches button{display:grid;justify-items:center;gap:4px;padding:8px 4px;font-size:12px}#pitlane-layout .pl-dot{width:24px;height:24px;border-radius:50%;background:var(--paint);border:1px solid #16355c66}#pitlane-layout .pl-price{min-width:88px}#pitlane-layout .pl-notice{border-left:3px solid #d96a00;padding-left:10px;font-size:12px}#pitlane-layout .pl-stat{display:grid;grid-template-columns:1fr auto;gap:4px}#pitlane-layout .pl-stat .pl-meter{grid-column:1 / -1;margin:0 0 6px}
@media(max-width:350px){#pitlane-layout .pl-content{padding:12px}#pitlane-layout .pl-inventory{grid-template-columns:repeat(2,minmax(0,1fr))}#pitlane-layout .pl-avatar{width:28px;height:28px}#pitlane-layout .pl-wallet b{font-size:14px}#pitlane-layout .pl-gems{font-size:12px}#pitlane-layout .pl-row{gap:6px}#pitlane-layout .pl-price{min-width:76px}#pitlane-layout .pl-art{width:42px;height:42px}}
</style>
<div class="pl-review"><label for="pl-screen">Màn hình</label><select id="pl-screen" aria-label="Xem layout tính năng">
<option value="race">Đua / Nâng cấp nhanh</option><option value="revenue">Doanh thu</option><option value="bag">Túi / Bộ sưu tập</option><option value="packs">Túi / Mở gói</option><option value="drivers">Đội / Tay đua</option><option value="recruit">Đội / Tuyển</option><option value="garage">Garage / Xe</option><option value="collection">Garage / Bộ sưu tập xe</option><option value="parts">Garage / Phụ tùng</option><option value="look">Garage / Ngoại hình</option><option value="league">Giải / Mùa & cơ sở</option><option value="shop">Shop</option><option value="result">Kết quả chặng</option><option value="offline">Thu nhập offline</option><option value="settings">Cài đặt</option></select><small>Đề xuất bố cục · số liệu minh họa</small></div>
<div class="pl-phone" aria-label="Pitlane Club — thiết kế giao diện">
<header class="pl-head"><img class="pl-avatar" src="layout_review_assets/avatar.webp" alt=""><div class="pl-wallet"><b>120.5K tiền</b><small>Thu nhập 240/giây</small></div><div class="pl-gems"><img src="layout_review_assets/gem.webp" alt="Gem">100</div><button class="pl-flat" data-screen="settings" aria-label="Cài đặt">⚙</button></header>
<div id="pl-race-strip" class="pl-strip"><span>Chặng 3/5 · P3 · 00:28</span><button data-screen="race">Xem đua</button></div>
<main id="pl-content" class="pl-content" aria-live="polite"></main>
<nav class="pl-nav" aria-label="Điều hướng chính"><button data-screen="race"><img src="layout_review_assets/flag.webp" alt="">Đua</button><button data-screen="bag"><img src="layout_review_assets/tools.webp" alt="">Túi</button><button data-screen="drivers"><img src="layout_review_assets/staff.webp" alt="">Đội</button><button data-screen="league"><img src="layout_review_assets/trophy.webp" alt="">Giải</button><button data-screen="shop"><img src="layout_review_assets/shop.webp" alt="">Shop</button></nav>
</div>
<script>
(()=>{
const root=document.getElementById('pitlane-layout'),body=root.querySelector('#pl-content'),picker=root.querySelector('#pl-screen');
const art={car:'layout_review_assets/car.webp',track:'layout_review_assets/track.webp',driver:'layout_review_assets/portrait.webp',gift:'layout_review_assets/gift.webp',crate:'layout_review_assets/crate.webp',money:'layout_review_assets/money.webp',helmet:'layout_review_assets/helmet.webp',cash:'layout_review_assets/cash.webp',trophy:'layout_review_assets/trophy.webp',energy:'layout_review_assets/energy.webp',gear:'layout_review_assets/gear.webp',crane:'layout_review_assets/crane.webp',research:'layout_review_assets/research.webp',seats:'layout_review_assets/seats.webp',crown:'layout_review_assets/crown.webp',garage:'layout_review_assets/garage.webp'};
const state={screen:'race',color:'Cam',part:'Động cơ',daily:false};
const img=(id,cls='pl-art')=>`<img class="${cls}" src="${art[id]}" alt="">`;
const btn=(text,to,cls='')=>`<button class="${cls}" data-screen="${to}">${text}</button>`;
const bar=(n)=>`<div class="pl-meter"><span style="width:${n}%"></span></div>`;
const teamTabs=()=>`<div class="pl-seg">${btn('Tay đua','drivers',state.screen==='drivers'||state.screen==='recruit'?'pl-on':'')}${btn('Garage','garage',!['drivers','recruit'].includes(state.screen)?'pl-on':'')}</div>`;
const garageTabs=()=>`<div class="pl-seg">${['Xe','Phụ tùng','Ngoại hình'].map((t,i)=>btn(t,['garage','parts','look'][i],state.screen===['garage','parts','look'][i]?'pl-on':'')).join('')}</div>`;
const carHero=()=>`<div class="pl-row pl-between"><div><h2>Pico Tia chớp</h2><small class="pl-muted">Hạng 1 · Đang dùng</small></div>${btn('Đổi xe','collection')}</div><div class="pl-stage">${img('car','pl-hero')}<small>Bản xem bố cục · ảnh xe hiện có</small></div>`;
const pack=(name,kind)=>`<div class="pl-card"><div class="pl-row">${img(kind)}<div class="pl-grow"><h3>${name}</h3><small>Coupon đúng loại: 10</small></div><button data-detail="rates" aria-label="Thông tin tỉ lệ ${name}">i</button></div><div class="pl-row" style="margin-top:12px"><button class="pl-main pl-grow" data-detail="open">Mở x1 · 1 coupon</button><button class="pl-grow" data-detail="open">x10 · 10 coupon</button></div></div>`;
function render(){
const s=state.screen;picker.value=s;root.querySelector('#pl-race-strip').hidden=['race','revenue'].includes(s);
const active=['bag','packs'].includes(s)?'bag':['drivers','recruit','garage','collection','parts','look'].includes(s)?'drivers':s==='league'?'league':s==='shop'?'shop':'race';
root.querySelectorAll('.pl-nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===active)));
let out='';
if(s==='race'||s==='revenue'){
out=`<div class="pl-row pl-between"><div><small>MÙA 2 · CHẶNG 3/5</small><h3>Circuit A</h3></div>${btn('Lịch','league')}</div><img class="pl-track" src="${art.track}" alt="Minh họa sân đua hiện có"><div class="pl-row pl-between"><b>P3 / 8</b><span>00:28 còn lại</span><small>Stamina 72%</small></div><div class="pl-card pl-row"><div class="pl-grow"><small>Lượt trước · P2</small><p>+12.4K tiền · +8 điểm</p></div>${btn('Chi tiết','result')}</div><div class="pl-seg">${btn('Xe đua','race',s==='race'?'pl-on':'')}${btn('Doanh thu','revenue',s==='revenue'?'pl-on':'')}</div><div class="pl-row pl-between"><small>Thay đổi cho lượt kế tiếp</small><select aria-label="Số cấp nâng"><option>×1</option><option>×10</option><option>×Max</option></select></div>`;
const rows=s==='race'?[['energy','Động cơ','Tốc độ 54 → 54.2'],['gear','Lốp','Bám đường 44 → 44.2'],['crane','Khung gầm','Ổn định 42 → 42.2'],['research','Hộp số','Tăng tốc 40 → 40.2']]:[['cash','Tiếp thị vé','Thu nhập tăng theo cấp'],['crown','Ăn mừng chiến thắng','Thu nhập tăng theo cấp'],['garage','Bãi đỗ','Thu nhập tăng theo cấp'],['seats','Khán đài','Thu nhập tăng theo cấp']];
out+=rows.map(([a,t,v])=>`<div class="pl-card pl-row">${img(a)}<div class="pl-grow"><h3>${t}</h3><small class="pl-muted">Cấp 12 · ${v}</small></div><button class="pl-main pl-price" data-detail="upgrade">2.4K<br><small>Nâng</small></button></div>`).join('');
}else if(s==='bag'){
out=`<div class="pl-row pl-between"><h2>Túi trang bị</h2><span class="pl-tag">Sở hữu 3/30</span></div><div class="pl-card"><b>Bonus toàn đội</b><p>Kiếm +60 · Khiên +60</p></div><div class="pl-seg">${btn('Bộ sưu tập','bag','pl-on')}${btn('Mở gói','packs')}</div><div class="pl-grid pl-inventory">${['Balaclava','Racing Gloves','Pit Cap','Neck Brace','Knee Pads','Driver Boots'].map((t,i)=>`<button data-detail="gear"><span class="pl-slot">${i<3?'◇':'?'}</span><span>${t}</span><small>${i<3?'Rare · Lv. 1':'Chưa sở hữu'}</small>${i<3?'<small>4 / 10 mảnh</small>':''}</button>`).join('')}</div>`;
}else if(s==='packs'){out=`<h2>Mở gói trang bị</h2>${btn('← Bộ sưu tập','bag')}${pack('STANDARD GEAR','crate')}${pack('ELITE GEAR','crate')}<small class="pl-muted">Sở hữu có hiệu lực toàn đội. Trùng đổi thành mảnh của chính món đó.</small>`;
}else if(s==='drivers'){
out=teamTabs()+`<h2>Tay đua</h2><div class="pl-card pl-row">${img('driver')}<div class="pl-grow"><h3>An</h3><p>Counterpuncher · Lv. 3</p><span class="pl-tag">Đang dùng</span></div><button data-detail="driver">Chi tiết</button></div><div class="pl-seg">${btn('Danh sách','drivers','pl-on')}${btn('Tuyển','recruit')}</div><h3>Đội của bạn</h3>${['Bình','Chi'].map((t,i)=>`<div class="pl-card pl-row"><span class="pl-slot">${t[0]}</span><div class="pl-grow"><h3>${t}</h3><small>${i?'Cornering 52 · Endurance 48':'Launch 52 · Speed 50'}</small></div><button data-detail="driver">Xem</button></div>`).join('')}<div class="pl-card"><h3>Tay đua chưa tuyển</h3><p>Điều kiện và chi phí nằm trong hồ sơ</p>${btn('Xem tuyển','recruit')}</div>`;
}else if(s==='recruit'){out=teamTabs()+`<h2>Tuyển tay đua</h2><div class="pl-card"><h3>Điểm trinh sát · 120 SP</h3><p>Điều kiện tuyển theo tay đua</p>${bar(60)}<button data-detail="driver">Xem hồ sơ tuyển</button></div>${pack('GÓI TAY ĐUA THƯỜNG','helmet')}${pack('GÓI TAY ĐUA CAO CẤP','helmet')}<small class="pl-muted">Tỉ lệ và bảo đảm lấy từ cấu hình gói tay đua.</small>`;
}else if(['garage','parts','look'].includes(s)){
out=teamTabs()+carHero()+garageTabs();
if(s==='garage')out+=`<div class="pl-grid">${[['Tốc độ','54.0'],['Bám đường','44.0'],['Ổn định','42.0'],['Tăng tốc','40.0']].map(([a,b])=>`<div class="pl-card"><small>${a}</small><h3>${b}</h3></div>`).join('')}</div><p class="pl-muted">Cấp và ngoại hình được lưu riêng cho xe này.</p>${btn('Xem phụ tùng','parts','pl-main')}`;
if(s==='parts')out+=`<div class="pl-grid">${['Động cơ','Lốp','Khung gầm','Hộp số'].map((t,i)=>`<button data-part="${t}" class="${state.part===t?'pl-on':''}">${t}<br><small>Cấp 12</small></button>`).join('')}</div><div class="pl-card"><h3>${state.part}</h3><p>Chỉ số hiện tại 54 → 54.2</p>${bar(6)}<div class="pl-row pl-between"><select aria-label="Số cấp phụ tùng"><option>×1</option><option>×10</option><option>×Max</option></select><button class="pl-main" data-detail="upgrade">Nâng · 2.4K tiền</button></div></div>`;
if(s==='look')out+=`<h3>Sơn · ${state.color}</h3><div class="pl-swatches">${[['Cam','#ed742b'],['Đỏ','#d53a30'],['Xanh','#347bd9'],['Trắng','#ffffff']].map(([n,c])=>`<button data-color="${n}" aria-pressed="${state.color===n}"><span class="pl-dot" style="--paint:${c}"></span>${n}</button>`).join('')}</div><small class="pl-muted">Ảnh xe tạm chưa có mask đổi sơn.</small><h3>Decal</h3><div class="pl-seg"><button data-decal="Trống">Trống</button><button data-decal="Sọc">Sọc</button><button data-decal="Số đua">Số đua</button></div><p id="pl-draft">Bản xem trước · ${state.color}</p><button class="pl-main" data-detail="cosmetic">Lưu ngoại hình</button>`;
}else if(s==='collection'){out=`<h2>Bộ sưu tập xe</h2>${btn('← Garage','garage')}<div class="pl-grid">${['Pico','Nova','Apex','Titan','Zenith'].map((t,i)=>`<button data-detail="car">${img('car','pl-hero')}<b>${t}</b><p>Hạng ${i+1}</p><small>${i===0?'Đang dùng':i===1?'Chưa mua':'Khóa tiến trình'}</small></button>`).join('')}</div><small class="pl-muted">Ảnh hiện có dùng để đặt bố cục; cần 5 thân xe riêng.</small>`;
}else if(s==='league'){out=`<h2>Giải Tập sự</h2><div class="pl-card pl-row">${img('trophy')}<div class="pl-grow"><h3>Mùa 2 · 18/30 điểm</h3>${bar(60)}<small>Mục tiêu thăng hạng</small></div></div><h3>Lịch mùa giải</h3>${['Chặng 1 · P2 · +8 điểm','Chặng 2 · P1 · +10 điểm','Chặng 3 · Đang đua','Chặng 4 · Chưa tới','Chặng 5 · Chưa tới'].map((t,i)=>`<div class="pl-card"><span class="pl-tag">${i<2?'✓ Hoàn thành':i===2?'Đang diễn ra':'Sắp tới'}</span><p>${t}</p></div>`).join('')}<div class="pl-card"><h3>Cơ sở tiếp theo</h3><p>Hoàn thành điều kiện mùa và đủ chi phí</p><button data-detail="facility">Xem điều kiện</button></div><small class="pl-muted">Lịch hiển thị kết quả của đội bạn.</small>`;
}else if(s==='shop'){out=`<h2>Shop</h2><div class="pl-card"><div class="pl-row">${img('gift')}<div><h3>Quà hằng ngày</h3><p>Tiền + gem theo phần thưởng</p></div></div><button class="pl-claim" data-detail="daily">${state.daily?'Đã nhận hôm nay':'Nhận quà miễn phí'}</button></div><h3>Gói tài nguyên</h3><div class="pl-grid">${['crate','helmet','money','gift'].map((a,i)=>`<div class="pl-card">${img(a)}<h3>${['Trang bị','Tay đua','Tiền','Pass tháng'][i]}</h3><span class="pl-tag">Sắp có</span><button data-detail="coming">Xem nội dung</button></div>`).join('')}</div><div class="pl-notice">Các gói chưa tích hợp chưa thể mua.</div>`;
}else if(s==='result'){out=`<div class="pl-sheet">${img('trophy','pl-hero')}<h2>Về đích · P2</h2><p>Chặng 2 · Mùa 2</p><div class="pl-rule"></div><div class="pl-row pl-between"><span>Tiền đã cộng</span><b>+12.4K</b></div><div class="pl-row pl-between"><span>Điểm mùa</span><b>+8</b></div><div class="pl-row pl-between"><span>Điểm trinh sát</span><b>+10 SP</b></div><p class="pl-muted">Lượt tiếp theo vẫn đang diễn ra.</p>${btn('Đóng','race','pl-main')}</div>`;
}else if(s==='offline'){out=`<div class="pl-sheet">${img('money','pl-hero')}<h2>Chào mừng trở lại!</h2><p>Thời gian được tính · 2 giờ</p><div class="pl-card"><small>Thu nhập vắng mặt</small><h2>+48.6K tiền</h2></div><button class="pl-claim" data-detail="offline">Nhận thu nhập</button></div>`;
}else if(s==='settings'){out=`<h2>Cài đặt</h2>${['Nhạc','Âm thanh','Rung','Giảm chuyển động'].map((t,i)=>`<label class="pl-card pl-row pl-between"><span>${t}</span><input type="checkbox" aria-label="${t}" ${i<2?'checked':''} style="width:24px;height:24px"></label>`).join('')}${btn('Trở lại','race')}`;}
body.innerHTML=out;
}
function detail(type){let title='',content='';
if(type==='gear'){title='Balaclava · Rare';content='<div class="pl-slot">◇</div><p>Lv. 1 · Bonus toàn đội</p><p>Kiếm +20 → +30 · Khiên +20 → +30</p><p>4 / 10 mảnh</p><button disabled>Thiếu 6 mảnh để nâng</button>';}
else if(type==='driver'){title='Hồ sơ tay đua';content=img('driver','pl-hero')+['Launch','Speed','Braking','Cornering','Racecraft','Composure','Endurance'].map((t,i)=>`<div class="pl-stat"><span>${t}</span><b>${40+i*2}</b>${bar(40+i*2)}</div>`).join('')+'<button class="pl-main" data-detail="selected">Dùng tay đua · từ lượt sau</button>';}
else if(type==='car'){title='Xem xe';content=img('car','pl-hero')+'<p>Chỉ số · hạng · điều kiện mua</p><p>Chọn xem trước khi xác nhận mua.</p><button disabled>Kiểm tra điều kiện mở</button>';}
else if(type==='rates'){title='Thông tin gói';content='<p>Tỉ lệ độ hiếm, loại coupon và chi phí x1/x10 lấy từ cấu hình gói đang xem.</p><p>Gear và tay đua có quy tắc bảo đảm riêng.</p>';}
else if(type==='open'){title='Kết quả mở · minh họa';content=img('crate','pl-hero')+'<h3>Balaclava</h3><p>Trùng → mảnh của chính món</p><small>Số mảnh lấy từ cấu hình; mẫu này không chạy giao dịch.</small>';}
else if(type==='daily'){title=state.daily?'Quà đã nhận':'Quà hằng ngày';content=img('gift','pl-hero')+'<p>Tiền và gem theo phần thưởng hiện tại.</p>';state.daily=true;}
else if(type==='facility'){title='Mở cơ sở';content='<p>Mục tiêu mùa · điều kiện xe · chi phí</p><p>Thiếu điều kiện: ghi rõ điều kiện còn thiếu.</p><button disabled>Chưa đủ điều kiện</button>';}
else if(type==='coming'){title='Sắp có';content='<p>Nội dung này chưa có giao dịch trong game.</p>';}
else{title={upgrade:'Xem nâng cấp',cosmetic:'Ngoại hình',offline:'Thu nhập offline',selected:'Chọn tay đua'}[type]||'Chi tiết';content='<p>Bản thiết kế chỉ mô phỏng bố cục. Thao tác không thay đổi dữ liệu game.</p>';}
body.innerHTML=`<section class="pl-sheet"><div class="pl-row pl-between"><h2>${title}</h2><button data-close aria-label="Đóng chi tiết">✕</button></div>${content}<button data-close>Đóng</button></section>`;
}
function save(){try{window.openai?.setWidgetState?.({modelContent:{screen:state.screen,color:state.color},privateContent:{...state}})?.catch(()=>{});}catch{}}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen){state.screen=b.dataset.screen;render();save();}else if(b.hasAttribute('data-close'))render();else if(b.dataset.detail)detail(b.dataset.detail);else if(b.dataset.part){state.part=b.dataset.part;render();}else if(b.dataset.color){state.color=b.dataset.color;render();save();}else if(b.dataset.decal){root.querySelector('#pl-draft').textContent='Bản xem trước · '+state.color+' · '+b.dataset.decal;}});
picker.addEventListener('change',()=>{state.screen=picker.value;render();save();});
function restore(v){if(v?.privateContent){const p=v.privateContent;if([...picker.options].some(o=>o.value===p.screen))state.screen=p.screen;if(typeof p.color==='string')state.color=p.color;}render();}
restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
if(globalThis.Tweak){const settings={raceExpanded:false};new Tweak({container:root.querySelector('.pl-phone'),onChange:()=>{root.querySelector('#pl-race-strip').style.padding=settings.raceExpanded?'18px 14px':'8px 14px';}}).addToggle(settings,'raceExpanded',{label:'Dải đua rộng hơn'});}
})();
</script>
</div>

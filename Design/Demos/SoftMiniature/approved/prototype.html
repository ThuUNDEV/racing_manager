const stats=['Xuất phát','Tốc độ','Phanh','Kỹ thuật','Đua tranh','Bình tĩnh','Bền bỉ'];
popupLayouts.driver=()=>`<div class="strip">${art('CHÂN DUNG')}<div><b>Bình</b><p><small>Phong cách · Đã sở hữu</small></p></div><button data-dismiss>×</button></div><small>So với tay đua đang dùng: An</small><div class="radar-placeholder"><svg viewBox="0 0 280 210" role="img" aria-label="So sánh 7 chỉ số tay đua"><g transform="translate(140 105)" fill="none" stroke="#d0e3e5"><polygon points="0,-82 64,-51 80,18 35,74 -35,74 -80,18 -64,-51"/><polygon points="0,-54 42,-34 53,12 23,49 -23,49 -53,12 -42,-34"/><polygon points="0,-27 21,-17 26,6 11,24 -11,24 -26,6 -21,-17"/><path d="M0 0V-82M0 0L64 -51M0 0L80 18M0 0L35 74M0 0L-35 74M0 0L-80 18M0 0L-64 -51"/><polygon points="0,-60 48,-38 65,14 24,51 -27,56 -54,12 -48,-38" fill="#83c7e544" stroke="#6baecb" stroke-width="2"/><polygon points="0,-48 53,-42 54,12 28,58 -22,47 -62,14 -42,-34" fill="#ff994d22" stroke="#ed9957" stroke-width="2" stroke-dasharray="4 4"/></g></svg><small>Bình: xanh · An: cam</small></div>${stats.map((n,i)=>`<div class="popup-line"><span>${n}</span><b>${40+i} <small>(${i%2?'-2':'+3'})</small></b></div>`).join('')}<div class="box"><b>Đặc tính</b><p>Bám cua · Tổng chỉ số 301 (+8)</p></div><div class="box"><p>Cấp 2 / 5 · +2 toàn bộ chỉ số</p>${meter(12,20)}<small>Mảnh 12/20</small><button disabled>Chưa đủ mảnh</button></div><button class="cta" data-demo="Đã chọn · Demo">Chọn cho cuộc đua kế tiếp</button><small>Cuộc đua hiện tại giữ nguyên tay đua.</small>`;
popupLayouts.packs=()=>`<h3>Mở gói</h3>${packControls()}`;
popupLayouts.packresult=()=>`<h3>Kết quả mở gói</h3><p><small>Đã dùng: 1 vé · Dữ liệu minh họa</small></p>${['Động cơ · Rare · Mới','Lốp · Rare · Trùng → +5 mảnh','Tay đua · Epic · Mới'].map(n=>`<div class="popup-line">${art('ICON')}<span>${n}</span></div>`).join('')}<button class="cta" data-dismiss>Xong</button>`;
popupLayouts.odds=()=>`<h3>Thông tin tỉ lệ gói</h3><p>Tên gói được chọn</p>${['Rare','Epic','Legendary'].map(n=>`<div class="popup-line"><span>${n}</span><span>Tỉ lệ từ cấu hình</span></div>`).join('')}<p><small>Gói tay đua: hiển thị bậc bảo đảm và số lượt theo cấu hình. Tay đua trùng chuyển thành mảnh.</small></p><p><small>Một vé cho một lượt; phần thiếu thanh toán bằng gem.</small></p>`;
popupLayouts.purchase=()=>`<div class="strip"><h3>Chi tiết gói</h3><button data-dismiss>×</button></div>${art('KEY ART / VẬT PHẨM CỦA GÓI')}<h3>Quyền lợi</h3>${['Gem ×…','Vé tay đua ×…','Vé phụ kiện ×…'].map(n=>`<div class="popup-line"><span>□</span><b>${n}</b></div>`).join('')}<p><small>Nội dung thay đổi theo SKU; số lượng và giá lấy từ cấu hình/store.</small></p><button data-modal="odds">Xem tỉ lệ gói vé</button><button class="cta" data-modal="payment">Mua · Giá từ store</button>`;
popupLayouts.payment=()=>`<h3>Trạng thái thanh toán</h3><p>Đang xử lý giao dịch…</p><div class="controls">${['Thành công','Đã hủy','Lỗi','Đã sở hữu'].map(n=>`<button data-payment="${n}">${n}</button>`).join('')}</div><div id="payment-status" class="box">Chọn trạng thái để duyệt bố cục phản hồi.</div>`;
popupLayouts.collection=()=>`<div class="strip"><h3>Bộ sưu tập xe</h3><button data-dismiss>Quay lại</button></div><div class="controls"><button data-filter> Tất cả</button><button data-filter>Đã sở hữu</button></div><h3>Nhóm xe theo hạng</h3>${grid(['Xe đang dùng','Xe đã sở hữu','Xe có thể mua','Xe chưa mở'].map(n=>box(art('XE')+n,'Hạng · Trạng thái',btn('Xem xe','carbuy'))))}`;
popupLayouts.carbuy=()=>`<h3>Xe đang xem</h3>${art('PREVIEW XE')}<p>So với xe đang dùng ở cuộc đua kế tiếp</p>${grid(['Tốc độ +3','Tăng tốc -2','Bám đường +1','Ổn định 0'].map(n=>box(n,'')))}<button class="cta" data-modal="confirmcar">Mua xe · Giá tiền</button><button class="cta" data-demo="Đã chọn · Demo">Chọn xe đã sở hữu</button><p><small>Chưa mở: hiển thị điều kiện giải, khóa nút mua.</small></p>`;
popupLayouts.confirmcar=()=>`<h3>Xác nhận mua xe</h3><p>Tên xe · Giá tiền</p><p>Số dư sau khi mua</p><small>Mua xe không tự chọn xe để đua.</small><button class="cta" data-demo="Đã mua · Demo">Xác nhận mua</button><button data-dismiss>Hủy</button>`;
popupLayouts.settings=()=>`<div class="strip"><h3>⚙ Cài đặt</h3><button data-dismiss>×</button></div><hr><h3>Âm thanh</h3><label class="popup-line">Âm nhạc <input type="checkbox" checked></label><label class="popup-line">Hiệu ứng <input type="checkbox" checked></label><div class="popup-line"><span>Ngôn ngữ</span><button data-modal="language">Tiếng Việt</button></div>`;
popupLayouts.language=()=>`<h3>Ngôn ngữ</h3>${grid(['English','Tiếng Việt','日本語','한국어','中文','ไทย','Français','Deutsch'].map(n=>`<button data-demo="${n} ✓">${n}</button>`))}<small>Danh sách nhãn minh họa; chọn trong game sẽ tải lại giao diện.</small>`;

function draw(){portraitIndex=0;q('#content').dataset.page=current;q('#content').innerHTML=screens[current]();q('#screen').value=current;q('.nav').innerHTML=['Đua','Túi','Đội','Giải','Shop'].map((n,i)=>`<button data-screen="${i}" aria-label="${n}" class="${(current===5?2:current)===i?'active':''}">${clay(['flag','bag','team','trophy','shop'][i],32)}${(current===5?2:current)===i?'<br>'+n:''}</button>`).join('');q('#content').scrollTop=0;q('#notes').textContent=current===4?'Shop: toàn bộ nội dung cuộn; header và 5 tab cố định. Giá, số lượng chỉ là dữ liệu mẫu.':'Bản duyệt 02 · Soft Miniature · Dữ liệu minh họa.';}
r.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.garage){garageTab=b.dataset.garage;draw();}if(b.dataset.part){q('#part-name').textContent=b.dataset.part;}if(b.dataset.paint){paint=b.dataset.paint;draft=true;draw();}if(b.dataset.decal){decal=b.dataset.decal;draft=true;draw();}if(b.hasAttribute('data-save-look')){draft=false;draw();}if(b.hasAttribute('data-reset-look')){paint='Trắng';decal='Không';draft=false;draw();}if(b.dataset.demo){b.textContent=b.dataset.demo;}if(b.dataset.payment){q('#payment-status').textContent=b.dataset.payment+' · Phản hồi minh họa';}if(b.hasAttribute('data-filter')){b.classList.toggle('active');}if(b.dataset.screen!==undefined){current=+b.dataset.screen;draw();}if(b.dataset.modal){const d=dialogs[b.dataset.modal]||['Chọn loại cơ sở'];q('.modal').dataset.kind=b.dataset.modal;q('#close').hidden=['result','offline','daily','classes','facilitypicker'].includes(b.dataset.modal);q('#dialog').innerHTML=popupLayouts[b.dataset.modal]?popupLayouts[b.dataset.modal]():`<h3>${d[0]}</h3>${d.slice(1).map(x=>box(x,'')).join('')}<small>Trạng thái và dữ liệu minh họa, không giao dịch thật.</small>`;q('.modal').hidden=false;q('#close').focus();}if(b.hasAttribute('data-pick')){r.querySelectorAll('[data-pick]').forEach(x=>x.classList.remove('active'));b.classList.add('active');q('#picker-ok').disabled=false;}if(b.hasAttribute('data-claim')){b.textContent='Đã nhận · Demo';b.disabled=true;}if(b.id==='close'||b.hasAttribute('data-dismiss'))q('.modal').hidden=true;});q('#screen').onchange=e=>{current=+e.target.value;draw()};q('#size').onchange=e=>{q('.viewport').style.height=e.target.value+'px';q('.phone').style.maxWidth=e.target.value==='440'?'320px':'390px'};r.addEventListener('keydown',e=>{if(e.key==='Escape')q('.modal').hidden=true});draw();})();
</script>

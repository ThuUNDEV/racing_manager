<style>

#layout-review .upgrade-list{display:flex;flex-direction:column;gap:8px}#layout-review .upgrade-list .box{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;margin:0;align-items:center}#layout-review .upgrade-list .box>b{grid-column:1}#layout-review .upgrade-list .box>p{grid-column:1;margin:0}#layout-review .upgrade-list .box>button{grid-column:2;grid-row:1/3;max-width:145px;margin:0;width:auto}#layout-review .upgrade-list .box p p{margin:0}

#layout-review .result-hero{text-align:center;padding:18px 8px;background:#eef0f2;border-radius:8px;margin:12px 0}#layout-review .result-hero h2{margin:8px 0;font-size:26px}#layout-review .popup-table{border-collapse:collapse;width:100%;font-size:13px}#layout-review .popup-table th,#layout-review .popup-table td{padding:7px 5px;text-align:left;border-bottom:1px solid #d9dde1}#layout-review .player-row{background:#e7ebef;font-weight:700}#layout-review .popup-line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #d9dde1}#layout-review .popup-line b{text-align:right}#layout-review .daily-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}#layout-review .day{border:1px solid #c5cbd1;border-radius:6px;padding:8px 3px;text-align:center;display:flex;flex-direction:column;gap:4px;font-size:12px}#layout-review .day.today{border:2px solid #333c47;background:#edf0f3}#layout-review .daily-art{height:30px;font-size:22px}#layout-review .day:last-child{grid-column:1/-1}#layout-review .sheet>button{margin-top:12px}#layout-review .modal{inset:0;align-items:center}#layout-review .sheet{max-height:92%;padding:14px}#layout-review .modal[data-kind="result"]{inset:150px 12px auto;height:210px;padding:6px;background:transparent;pointer-events:none}#layout-review .modal[data-kind="result"] .sheet{max-width:300px;margin:auto;padding:8px;pointer-events:auto}#layout-review .result-title{padding:8px;background:#dfe4e8;border-radius:6px}#layout-review .result-timer{height:6px;background:#8d99a5;margin-top:8px}#layout-review .offline-art{height:145px;display:grid;place-items:center;text-align:center;background:#e6e8eb;font-size:12px}#layout-review .offline-amount{text-align:center;font-size:30px;padding:16px;background:#eceef0;border-radius:10px;margin:12px 0}#layout-review .offline-progress{height:28px;position:relative;background:#d9dde1;border-radius:14px;overflow:hidden;margin-bottom:12px}#layout-review .offline-progress>span{display:block;width:70%;height:28px;background:#a9b2bb}#layout-review .offline-progress>b{position:absolute;inset:4px;text-align:center;font-size:13px}#layout-review .center{text-align:center}#layout-review .day:last-child{grid-column:auto}#layout-review .grand-reward{border:1px solid #b8bec5;padding:10px;margin-top:10px;border-radius:8px;text-align:center}#layout-review .gift-placeholder{height:65px;min-width:65px;background:#e5e8eb;display:grid;place-items:center;font-size:11px}#layout-review .milestone-grid{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px}#layout-review .milestone-track{height:6px;background:#c8cdd3;margin:12px 0}#layout-review .daily-grid{margin-top:10px}#layout-review .day{gap:2px;padding:5px 2px}#layout-review .sheet h3{margin-top:0}#layout-review .car-showroom{height:176px;display:grid;place-content:center;text-align:center;border:1px dashed #aab1ba;background:#e5e8eb;border-radius:8px}#layout-review .paint-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}#layout-review .shard-meter{height:8px;background:#e0e3e6;margin:8px 0;border-radius:4px;overflow:hidden}#layout-review .shard-meter>span{display:block;height:8px;background:#8895a2;max-width:100%}#layout-review .radar-placeholder{height:230px;display:grid;place-content:center;text-align:center;background:repeating-radial-gradient(circle,#eceef0 0 28px,#c8cdd3 29px 30px);margin:10px 0;border-radius:8px}#layout-review .box>button{max-width:100%}#layout-review .grid.three .box{padding:7px;font-size:12px}#layout-review .grid.three button{font-size:12px;width:100%;padding:5px}#layout-review .popup-line .placeholder{width:48px;height:48px;flex-shrink:0;margin:0}</style>
<div id="layout-review">
<div class="controls"><label>Màn hình <select id="screen"><option value="0">Đua</option><option value="1">Túi</option><option value="2">Đội · Tay đua</option><option value="5">Đội · Garage</option><option value="3">Giải</option><option value="4">Shop</option></select></label><label>Chiều cao <select id="size"><option value="650">Thường · 390 × 778</option><option value="440">Thấp · 320 × 568</option></select></label></div>
<div class="phone"><header class="hud"><button data-modal="profile" aria-label="Hồ sơ">Lv.12</button><span class="wallet">Tiền<br><b>12.5K</b></span><span class="wallet">Gem<br><b>240</b></span><button data-modal="settings" aria-label="Cài đặt">⚙</button></header><main class="viewport" id="content"></main><nav class="nav" aria-label="Điều hướng chính"></nav><div class="modal" hidden><section class="sheet" role="dialog" aria-modal="true" aria-label="Chi tiết mockup"><div id="dialog"></div><button id="close" class="cta">Đóng</button></section></div></div>
<div class="notes" id="notes"></div><div class="controls"><button data-modal="result">Kết quả đua</button><button data-modal="offline">Thu nhập offline</button><button data-modal="daily">Quà hằng ngày</button><button data-modal="classes">Cơ sở đua</button></div>
</div>
<script>
(()=>{const r=document.getElementById('layout-review'),q=s=>r.querySelector(s);let current=0;const btn=(t,m)=>`<button class="cta" data-modal="${m}">${t}</button>`;const box=(title,desc,action='')=>`<div class="box"><b>${title}</b><p>${desc}</p>${action}</div>`;const grid=(items,three=false)=>`<div class="grid ${three?'three':''}">${items.join('')}</div>`;const art=t=>`<div class="placeholder">${t}</div>`;
const upgrade=(name,i)=>{const revenue=['Vé','Ăn mừng','Bãi đỗ','Khán đài'].includes(name);const effect=revenue?'Thu nhập':({'Động cơ':'Tốc độ','Lốp':'Bám đường','Khung gầm':'Ổn định','Hộp số':'Tăng tốc'})[name];return `<div class="upgrade-item"><div class="upgrade-icon" aria-hidden="true">${({'Động cơ':'⚙','Lốp':'◉','Khung gầm':'▱','Hộp số':'⊞','Vé':'▤','Ăn mừng':'☆','Bãi đỗ':'P','Khán đài':'▥'})[name]}</div><div class="upgrade-info"><b>${name}</b><small>${effect}</small></div><div class="upgrade-values"><div class="upgrade-level">${i===3?'Cấp 11':`Cấp ${i+8} → ${i+9}`}</div><div class="upgrade-numbers">46 <span>→</span> <b>48</b>${revenue?'<small>/phút</small>':''}</div></div><div class="upgrade-action">${i===2?'<button disabled aria-label="Nâng cấp giá 15K tiền, thiếu 2.5K"><b>15K tiền</b></button><small>Thiếu 2.5K</small>':i===3?'<button disabled><b>Chưa mở</b></button><small>Mở ở cấp 15</small>':'<button data-modal="upgrade" aria-label="Nâng cấp giá 3.2K tiền"><b>3.2K tiền</b></button>'}</div></div>`};
const screens=[()=>`<div class="strip"><b>Tập sự · Chặng 3/5</b><button data-modal="classes">Cơ sở</button></div><p>Thu nhập 1.25K/phút</p><div class="track"><b>VÙNG TRACK 3D NGHIÊNG</b><small>Xe người chơi · P3/8 · Vòng 2/3</small></div><div class="strip"><small>Harbor Circuit</small></div><h3>Nâng cấp xe</h3><div class="upgrade-list">${['Động cơ','Lốp','Khung gầm','Hộp số'].map(upgrade).join('')}</div><h3>Thu nhập</h3><div class="upgrade-list">${['Vé','Ăn mừng','Bãi đỗ','Khán đài'].map(upgrade).join('')}</div>`,
()=>`<h3>Túi phụ kiện</h3><div class="strip"><b>Đã có · Tất cả độ hiếm</b><small>12 món</small></div>${grid(['Động cơ','Lốp','Cánh gió','Hộp số','Phanh','Khung xe'].map((n,i)=>box(art('Phụ kiện')+n,`Hiếm · Cấp ${i+1}<br>Mảnh 12/20`,btn('Chi tiết','gear'))),true)}`,
()=>`<div class="controls"><button class="active">Tay đua</button><button data-screen="5">Garage</button></div>${box('Sức mạnh đội · 1,280','Tay đua đang dùng: An · Cấp 12')}<div class="strip"><b>Danh sách tay đua</b><button data-modal="packs">Mở gói</button></div>${grid(['An · Đang dùng','Bình · Sở hữu','Chi · Sở hữu','Lâm · Chưa sở hữu'].map(n=>box(art('Chân dung')+n,'SP 420 · Thể lực 90%',btn('Chi tiết','driver'))))}`,
()=>`<h3>Giải tập sự</h3>${box('Cúp hiện có · 24','Hệ số thưởng cúp ×1')}<div class="controls"><button class="active">Xe đua</button><button data-modal="trophy">Thu nhập</button></div><h3>Nâng cấp bằng cúp</h3>${['Tốc độ','Bám đường','Thưởng tiền','Thưởng cúp'].map(n=>box(n,'Cấp 2 · Hiệu quả 10% → 12%',btn('Nâng · 8 cúp','trophy'))).join('')}`,
()=>`<h3>Shop</h3><h3>Gói đặc biệt</h3>${grid(['Gói khởi đầu','Thu nhập ×2','Bỏ quảng cáo','Gói kết hợp'].map(n=>box(art('Vật phẩm')+n,'Nội dung gói · quyền lợi',btn('Xem gói','purchase'))))}<h3>Tuyển tay đua</h3>${grid(['Mỹ','Lâm'].map(n=>box(art('Chân dung')+n,'Chỉ số · đặc tính',btn('Xem gói','purchase'))))}${box('Quà hằng ngày','Tiến trình 7 ngày',btn('Xem phần thưởng','daily'))}${box('Gem miễn phí','Xem quảng cáo để nhận',btn('Chi tiết','reward'))}<h3>Gói ngày</h3>${box('Gói hằng ngày','Danh sách vật phẩm',btn('Xem gói','purchase'))}<h3>Gem</h3>${grid(['80','500','1200'].map(n=>box(art('Gem')+n,'Giá từ cửa hàng',btn('Chi tiết','purchase'))),true)}<h3>Đổi tiền</h3>${grid(['Gói nhỏ','Gói vừa','Gói lớn'].map(n=>box(n,'Tiền nhận / giá gem',btn('Đổi','exchange'))),true)}<h3>Mở gói</h3>${box('Phụ kiện · Standard / Elite','Vé hiện có 7 / 3',btn('Mở gói','packs'))}${box('Tay đua · Standard / Pro','Vé hiện có 5 / 2',btn('Mở gói','packs'))}<h3>Vé miễn phí</h3>${grid(['Vé phụ kiện','Vé tay đua'].map(n=>box(n,'Quảng cáo nhận thưởng',btn('Chi tiết','reward'))))}<h3>Quyền lợi khác</h3>${box('Thu nhập ×3 · Offline+','Gói và quyền lợi',btn('Xem gói','purchase'))}<h3>Combo · Gói tuần · Tay đua khác</h3>${box('Danh sách tiếp theo','Các offer đủ điều kiện hiển thị',btn('Xem gói','purchase'))}<button data-modal="restore">Khôi phục giao dịch</button>`,
()=>`<div class="controls"><button data-screen="2">Tay đua</button><button class="active">Garage</button></div>${box(art('XE 3D / PREVIEW'),'Xe đang sử dụng · SP 1,280')}<h3>Trang bị trên xe</h3>${grid(['Động cơ','Lốp','Khung','Hộp số'].map(n=>box(n,'Phụ kiện đang lắp',btn('Thay / Chi tiết','gear'))))}<h3>Thông số xe</h3>${box('Tốc độ · Tăng tốc · Bám đường','46.0 · 38.0 · 42.0')}<h3>Xe sở hữu</h3>${box('Xe mặc định','Đang dùng',btn('Chi tiết','car'))}`];
const dialogs={upgrade:['Nâng cấp','Động cơ · Cấp 12 → 13','Tốc độ 46.0 → 46.3','Giá 3.2K tiền'],gear:['Chi tiết phụ kiện','Động cơ hiếm · Cấp 2','Thông số · Xe đang lắp','Mảnh 12/20 · Chưa đủ nâng'],driver:['Chi tiết tay đua','An · Cấp 12 · Đang dùng','7 chỉ số · Đặc tính · Thể lực','So sánh với người đang dùng'],purchase:['Chi tiết gói mua','Vật phẩm và số lượng đầy đủ','Quyền lợi · Phạm vi áp dụng','Giá thực lấy từ store · Đây là mockup'],exchange:['Xác nhận đổi tiền','Nhận 4.08B tiền','Chi phí 10 gem','Số dư 240 → 230 gem'],packs:['Mở gói','Phụ kiện / Tay đua · Loại gói','Xem tỉ lệ · Vé hiện có','Mở ×1 / ×10'],result:['Kết quả đua','P3 / 8 · Thời gian 01:24','Bảng thứ hạng 8 xe','Tiền +1.25K · Cúp +3'],offline:['Thu nhập offline','Vắng 1 giờ 24 phút','Thời gian được tính · Rate · Giới hạn','Tiền nhận +12.5K'],daily:['Quà hằng ngày','D1 ✓ · D2 ✓ · D3 Hôm nay','D4 · D5 · D6 · D7','Phần thưởng hôm nay · Nhận'],classes:['Cơ sở đua','Cơ sở đang dùng · Cấp mở khóa','Danh sách cơ sở · Hiệu quả','Nâng cấp / Mở rộng'],profile:['Hồ sơ','Cấp 12 · XP 320/500','Thành tích · Thống kê','Tên người chơi'],settings:['Cài đặt','Âm nhạc · Hiệu ứng · Rung','Ngôn ngữ · Giảm chuyển động','Khôi phục mua · Phiên bản'],trophy:['Nâng bằng cúp','Cấp 2 → 3','Hiệu quả 10% → 12%','Giá 8 cúp · Hiện có 24'],reward:['Thưởng quảng cáo','Phần thưởng được hiển thị trước','Chỉ nhận khi xem xong','Không có quảng cáo: thử lại sau'],restore:['Khôi phục giao dịch','Khôi phục quyền lợi đã mua','Đang kiểm tra / Thành công / Lỗi','Không phát sinh giao dịch mới'],car:['Chi tiết xe','Xe đang dùng','Thông số · Điều kiện mở','Chọn xe']};
const popupLayouts={
result:()=>`<div class="strip result-title"><b>Lên bục</b><b>P3</b></div><div class="popup-line"><span>Tiền</span><b>+1.25K</b></div><div class="popup-line"><span>Cúp</span><b>+3 · Có 24/100</b></div><div class="popup-line"><span>Điểm tuyển dụng SP</span><b>+12</b></div><div class="result-timer" aria-label="Thanh thời gian hiển thị"></div>`,
offline:()=>`<h3>▤ Thu nhập offline</h3><hr><div class="offline-art">ẢNH GARAGE / THU NHẬP OFFLINE</div><div class="offline-amount">▤ +12.5K</div><div class="offline-progress"><span></span><b>84 / 120 phút</b></div><button class="cta" data-dismiss>Tiếp tục</button>`,
daily:()=>`<div class="strip"><h3>Quà hằng ngày</h3><button data-dismiss aria-label="Đóng">×</button></div><p class="center">Đăng nhập mỗi ngày để nhận quà</p><p class="center"><small>Đã nhận 2 ngày</small></p><div class="daily-grid">${['Gem','Vé tay đua','Vé phụ kiện','Gem','Vé tay đua','Gem'].map((n,i)=>`<div class="day ${i===2?'today':''}"><b>Ngày ${i+1}</b><div class="daily-art">${i<2?'✓':'□'}</div><span>${n}</span><small>${i<2?'Đã nhận':i===2?'Hôm nay':i===3?'Ngày mai':''}</small></div>`).join('')}</div><div class="grand-reward"><b>Ngày 7 · Phần thưởng đặc biệt</b><div class="strip"><div class="gift-placeholder">HỘP QUÀ</div><div>Gem + Vé<br><small>Nhận khi đủ 7 ngày</small></div></div></div><div class="box"><div class="strip"><b>Quà mốc</b><span>2 / 10 ngày</span></div><div class="milestone-track"></div><div class="milestone-grid">${[10,20,30,40].map(n=>`<div><small>Ngày ${n}</small><p>□</p><small>Gem / Vé</small></div>`).join('')}</div><p class="center"><small>Còn 8 ngày tới mốc tiếp theo</small></p></div><button class="cta" data-claim>Nhận quà</button>`,
classes:()=>`<div class="strip"><div><h3>Classes</h3><small>Quản lý cơ sở đua</small></div><b>▤ 12.5K</b><button data-dismiss aria-label="Đóng">×</button></div><div class="popup-line"><b>Cơ sở</b><span>1 / 6</span></div><div class="box"><div class="strip"><div class="gift-placeholder">XE</div><div><b>Loại cơ sở đang sở hữu</b><p><small>Đang đua · Mô tả loại đua</small></p></div></div><hr><small>Tên đội</small><p><b>Đội của bạn</b></p><div class="grid"><div class="box"><small>Giải hiện tại</small><p>Tập sự</p></div><div class="box"><small>Thu nhập</small><p>+20 / giây</p></div></div><div class="box"><b>Xe gợi ý: Bám đường</b><p><small>Chỉ số quan trọng cho loại đua này</small></p></div></div><div class="box"><div class="strip"><div class="gift-placeholder">GARAGE</div><div><b>Mở cơ sở mới</b><p><small>Thêm loại đua, tăng thu nhập</small></p></div></div><p>Sẵn sàng mở cơ sở mới</p><button class="cta" data-modal="facilitypicker">Mở cơ sở · Giá tiền</button></div>`,
facilitypicker:()=>`<h3 class="center">Chọn loại cơ sở</h3><p class="center">Chọn loại đua cho cơ sở mới</p><div class="grid">${['Loại đua A','Loại đua B','Loại đua C','Loại đua D'].map(n=>`<button data-pick>${art('XE')}${n}<br><small>Mô tả loại đua</small></button>`).join('')}</div><button class="cta" id="picker-ok" disabled data-dismiss>OK</button>`
};
const meter=(v,max)=>`<div class="shard-meter"><span style="width:${v/max*100}%"></span></div>`;
const partNames=['Động cơ','Lốp','Khung gầm','Hộp số'];
let garageTab='car',paint='Trắng',decal='Không',draft=false;
const garageTabs=()=>`<div class="controls">${[['car','Xe'],['parts','Phụ tùng'],['look','Ngoại hình']].map(([id,n])=>`<button data-garage="${id}" class="${garageTab===id?'active':''}">${n}</button>`).join('')}</div>`;
function garageBody(){if(garageTab==='parts')return `${grid(partNames.map(n=>`<button data-part="${n}">${n}<br><small>Cấp 8 / 200 · 46.0</small></button>`))}<div class="box"><div class="strip"><b id="part-name">Động cơ</b><label>Mua <select><option>×1</option><option>×10</option><option>×Max</option></select></label></div><p>Cấp 8 → 9</p><p>46.0 → 48.0</p><button class="cta" data-demo="Đã nâng cấp · Demo">Nâng · 3.2K tiền</button></div>`;if(garageTab==='look')return `<h3>Màu sơn</h3><div class="paint-grid">${['Trắng','Cam','Xanh','Đỏ','Đen','Vàng','Tím','Bạc'].map(n=>`<button data-paint="${n}" class="${paint===n?'active':''}">●<br>${n}</button>`).join('')}</div><h3>Decal</h3>${grid(['Không','Sọc','Tia chớp','Số xe'].map(n=>`<button data-decal="${n}" class="${decal===n?'active':''}">${n}</button>`))}<p><small>Miễn phí · Không tăng chỉ số</small></p><div class="strip"><span>${draft?'Bản nháp chưa lưu':'Ngoại hình đã lưu'}</span><button data-reset-look>Hủy</button></div><button class="cta" data-save-look ${draft?'':'disabled'}>Lưu ngoại hình</button>`;return `${grid(['Tốc độ','Tăng tốc','Bám đường','Ổn định'].map((n,i)=>box(n,String(46-i*2))))}<p><small>Cấp phụ tùng được giữ riêng theo từng xe.</small></p><button disabled class="cta">Đang dùng</button><button class="cta" data-modal="carbuy">Xem trạng thái mua / chọn xe khác</button>`;}
screens[5]=()=>`<div class="controls"><button data-screen="2">Tay đua</button><button class="active">Garage</button></div><div class="strip"><h3>Garage</h3><button data-modal="collection">Bộ sưu tập</button></div><div class="car-showroom">PREVIEW XE<br><small>${paint} · ${decal}</small></div><p><small>Đang dùng · Thay đổi áp dụng từ cuộc đua kế tiếp</small></p>${garageTabs()}${garageBody()}`;
screens[1]=()=>`<h3>Túi phụ kiện</h3><div class="strip"><b>Kho phụ kiện</b><small>6 / 12 sở hữu</small></div><p>Sức mạnh phụ kiện: +240</p>${grid(['Động cơ','Lốp','Cánh gió','Hộp số','Phanh','Khung xe','Chưa sở hữu','Chưa sở hữu','Chưa sở hữu'].map((n,i)=>i>5?box(art('Bóng vật phẩm'),'Chưa sở hữu'):box(art('ICON')+n,`★★☆☆☆<br><small>Rare · Power +40</small>${meter(i===0?24:12,20)}<small>Mảnh ${i===0?24:12}/20</small>`,i===0?'<button class="cta" data-demo="Đã nâng · Demo">Nâng cấp</button>':'')),true)}`;
const oldShop=screens[4];
screens[4]=()=>{let s=oldShop();s=s.replace('<h3>Combo · Gói tuần · Tay đua khác</h3>'+box('Danh sách tiếp theo','Các offer đủ điều kiện hiển thị',btn('Xem gói','purchase')),`<h3>Combo đột phá</h3>${grid(['Combo 1','Combo 2'].map(n=>box(art('GEM + VÉ')+n,'Danh sách quyền lợi',btn('Xem gói','purchase'))))}<h3>Gói tuần</h3>${grid(['Gói tuần nhỏ','Gói tuần lớn'].map(n=>box(art('VẬT PHẨM')+n,'Vật phẩm · Giới hạn mua',btn('Xem gói','purchase'))))}<h3>Tay đua khác</h3>${grid(['Nhân','Phương','Quang','Sơn'].map(n=>box(art('CHÂN DUNG')+n,'Đặc tính · Bậc',btn('Xem gói','purchase'))))}`);s=s.replaceAll(btn('Mở gói','packs'),packControls());return s;};
function packControls(){return `<p>Standard · Vé 7 · Elite / Pro · Vé 3</p><div class="controls"><button data-modal="odds">ⓘ Tỉ lệ</button><button data-modal="packresult">Mở ×1</button><button data-modal="packresult">Mở ×10</button></div><small>Ưu tiên vé; phần còn lại dùng gem.</small>`;}
const stats=['Xuất phát','Tốc độ','Phanh','Kỹ thuật','Đua tranh','Bình tĩnh','Bền bỉ'];
popupLayouts.driver=()=>`<div class="strip">${art('CHÂN DUNG')}<div><b>Bình</b><p><small>Phong cách · Đã sở hữu</small></p></div><button data-dismiss>×</button></div><small>So với tay đua đang dùng: An</small><div class="radar-placeholder">BIỂU ĐỒ RADAR · 7 TRỤC<br><small>Bình: nét liền · An: nét đứt</small></div>${stats.map((n,i)=>`<div class="popup-line"><span>${n}</span><b>${40+i} <small>(${i%2?'-2':'+3'})</small></b></div>`).join('')}<div class="box"><b>Đặc tính</b><p>Bám cua · Tổng chỉ số 301 (+8)</p></div><div class="box"><p>Cấp 2 / 5 · +2 toàn bộ chỉ số</p>${meter(12,20)}<small>Mảnh 12/20</small><button disabled>Chưa đủ mảnh</button></div><button class="cta" data-demo="Đã chọn · Demo">Chọn cho cuộc đua kế tiếp</button><small>Cuộc đua hiện tại giữ nguyên tay đua.</small>`;
popupLayouts.packs=()=>`<h3>Mở gói</h3>${packControls()}`;
popupLayouts.packresult=()=>`<h3>Kết quả mở gói</h3><p><small>Đã dùng: 1 vé · Dữ liệu minh họa</small></p>${['Động cơ · Rare · Mới','Lốp · Rare · Trùng → +5 mảnh','Tay đua · Epic · Mới'].map(n=>`<div class="popup-line">${art('ICON')}<span>${n}</span></div>`).join('')}<button class="cta" data-dismiss>Xong</button>`;
popupLayouts.odds=()=>`<h3>Thông tin tỉ lệ gói</h3><p>Tên gói được chọn</p>${['Rare','Epic','Legendary'].map(n=>`<div class="popup-line"><span>${n}</span><span>Tỉ lệ từ cấu hình</span></div>`).join('')}<p><small>Gói tay đua: hiển thị bậc bảo đảm và số lượt theo cấu hình. Tay đua trùng chuyển thành mảnh.</small></p><p><small>Một vé cho một lượt; phần thiếu thanh toán bằng gem.</small></p>`;
popupLayouts.purchase=()=>`<div class="strip"><h3>Chi tiết gói</h3><button data-dismiss>×</button></div>${art('KEY ART / VẬT PHẨM CỦA GÓI')}<h3>Quyền lợi</h3>${['Gem ×…','Vé tay đua ×…','Vé phụ kiện ×…'].map(n=>`<div class="popup-line"><span>□</span><b>${n}</b></div>`).join('')}<p><small>Nội dung thay đổi theo SKU; số lượng và giá lấy từ cấu hình/store.</small></p><button data-modal="odds">Xem tỉ lệ gói vé</button><button class="cta" data-modal="payment">Mua · Giá từ store</button>`;
popupLayouts.payment=()=>`<h3>Trạng thái thanh toán</h3><p>Đang xử lý giao dịch…</p><div class="controls">${['Thành công','Đã hủy','Lỗi','Đã sở hữu'].map(n=>`<button data-payment="${n}">${n}</button>`).join('')}</div><div id="payment-status" class="box">Chọn trạng thái để duyệt bố cục phản hồi.</div>`;
popupLayouts.collection=()=>`<div class="strip"><h3>Bộ sưu tập xe</h3><button data-dismiss>Quay lại</button></div><div class="controls"><button data-filter> Tất cả</button><button data-filter>Đã sở hữu</button></div><h3>Nhóm xe theo hạng</h3>${grid(['Xe đang dùng','Xe đã sở hữu','Xe có thể mua','Xe chưa mở'].map(n=>box(art('XE')+n,'Hạng · Trạng thái',btn('Xem xe','carbuy'))))}`;
popupLayouts.carbuy=()=>`<h3>Xe đang xem</h3>${art('PREVIEW XE')}<p>So với xe đang dùng ở cuộc đua kế tiếp</p>${grid(['Tốc độ +3','Tăng tốc -2','Bám đường +1','Ổn định 0'].map(n=>box(n,'')))}<button class="cta" data-modal="confirmcar">Mua xe · Giá tiền</button><button class="cta" data-demo="Đã chọn · Demo">Chọn xe đã sở hữu</button><p><small>Chưa mở: hiển thị điều kiện giải, khóa nút mua.</small></p>`;
popupLayouts.confirmcar=()=>`<h3>Xác nhận mua xe</h3><p>Tên xe · Giá tiền</p><p>Số dư sau khi mua</p><small>Mua xe không tự chọn xe để đua.</small><button class="cta" data-demo="Đã mua · Demo">Xác nhận mua</button><button data-dismiss>Hủy</button>`;
popupLayouts.settings=()=>`<div class="strip"><h3>⚙ Cài đặt</h3><button data-dismiss>×</button></div><hr><h3>Âm thanh</h3><label class="popup-line">Âm nhạc <input type="checkbox" checked></label><label class="popup-line">Hiệu ứng <input type="checkbox" checked></label><div class="popup-line"><span>Ngôn ngữ</span><button data-modal="language">Tiếng Việt</button></div>`;
popupLayouts.language=()=>`<h3>Ngôn ngữ</h3>${grid(['English','Tiếng Việt','日本語','한국어','中文','ไทย','Français','Deutsch'].map(n=>`<button data-demo="${n} ✓">${n}</button>`))}<small>Danh sách nhãn minh họa; chọn trong game sẽ tải lại giao diện.</small>`;

function draw(){q('#content').innerHTML=screens[current]();q('#screen').value=current;q('.nav').innerHTML=['Đua','Túi','Đội','Giải','Shop'].map((n,i)=>`<button data-screen="${i}" aria-label="${n}" class="${(current===5?2:current)===i?'active':''}">${['⚑','▣','♙','♜','▤'][i]}${(current===5?2:current)===i?'<br>'+n:''}</button>`).join('');q('#content').scrollTop=0;q('#notes').textContent=current===4?'Shop: toàn bộ nội dung cuộn; header và 5 tab cố định. Giá, số lượng chỉ là dữ liệu mẫu.':'Header và 5 tab cố định; nội dung cuộn. Bản đề xuất bố cục, chưa chốt phong cách đồ họa.';}
r.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.garage){garageTab=b.dataset.garage;draw();}if(b.dataset.part){q('#part-name').textContent=b.dataset.part;}if(b.dataset.paint){paint=b.dataset.paint;draft=true;draw();}if(b.dataset.decal){decal=b.dataset.decal;draft=true;draw();}if(b.hasAttribute('data-save-look')){draft=false;draw();}if(b.hasAttribute('data-reset-look')){paint='Trắng';decal='Không';draft=false;draw();}if(b.dataset.demo){b.textContent=b.dataset.demo;}if(b.dataset.payment){q('#payment-status').textContent=b.dataset.payment+' · Phản hồi minh họa';}if(b.hasAttribute('data-filter')){b.classList.toggle('active');}if(b.dataset.screen!==undefined){current=+b.dataset.screen;draw();}if(b.dataset.modal){const d=dialogs[b.dataset.modal]||['Chọn loại cơ sở'];q('.modal').dataset.kind=b.dataset.modal;q('#close').hidden=['result','offline','daily','classes','facilitypicker'].includes(b.dataset.modal);q('#dialog').innerHTML=popupLayouts[b.dataset.modal]?popupLayouts[b.dataset.modal]():`<h3>${d[0]}</h3>${d.slice(1).map(x=>box(x,'')).join('')}<small>Trạng thái và dữ liệu minh họa, không giao dịch thật.</small>`;q('.modal').hidden=false;q('#close').focus();}if(b.hasAttribute('data-pick')){r.querySelectorAll('[data-pick]').forEach(x=>x.classList.remove('active'));b.classList.add('active');q('#picker-ok').disabled=false;}if(b.hasAttribute('data-claim')){b.textContent='Đã nhận · Demo';b.disabled=true;}if(b.id==='close'||b.hasAttribute('data-dismiss'))q('.modal').hidden=true;});q('#screen').onchange=e=>{current=+e.target.value;draw()};q('#size').onchange=e=>{q('.viewport').style.height=e.target.value+'px';q('.phone').style.maxWidth=e.target.value==='440'?'320px':'390px'};r.addEventListener('keydown',e=>{if(e.key==='Escape')q('.modal').hidden=true});draw();})();
</script>
